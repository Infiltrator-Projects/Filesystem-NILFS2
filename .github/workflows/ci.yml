# SPDX-License-Identifier: GPL-3.0-or-later
name: NILFS2 Common V2 recognition qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - name: Native Common V2 hosted and import-free checks
        run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
      - name: Independent formatter image (test oracle only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nilfs-tools
          truncate -s 268435456 build/foreign.img
          mkfs.nilfs2 -f build/foreign.img
          sha256sum build/foreign.img > build/before
          build/test_nilfs2 ./build/NILFS2.so build/foreign.img
          build/test_nilfs2 ./build/freestanding/NILFS2.so build/foreign.img
          sha256sum -c build/before
      - name: Independently populated NILFS2 media (test oracle only)
        run: |
          set -euo pipefail
          # The reference implementation creates the disposable image only.
          # Native providers must read it after unmount, never through VFS.
          if ! sudo modprobe nilfs2; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe nilfs2
          fi
          truncate -s 536870912 build/populated.img
          mkfs.nilfs2 -f build/populated.img
          mkdir -p build/mnt
          dd if=/dev/urandom of=build/proof.bin bs=33001 count=1 status=none
          loop=$(sudo losetup --find --show build/populated.img)
          cleanup() {
            if mountpoint -q build/mnt; then sudo umount build/mnt; fi
            sudo losetup -d "$loop"
          }
          trap cleanup EXIT
          sudo mount -t nilfs2 -o rw,nogc "$loop" build/mnt
          sudo cp build/proof.bin build/mnt/proof.bin
          sudo mkdir build/mnt/sub
          printf hello | sudo tee build/mnt/sub/note.txt >/dev/null
          printf 'tail!' | sudo dd of=build/mnt/sparse.bin bs=1 seek=8192 status=none
          sync
          sudo cmp build/proof.bin build/mnt/proof.bin
          sudo umount build/mnt
          sudo losetup -d "$loop"
          trap - EXIT
          sha256sum build/populated.img > build/populated-before
          build/test_nilfs2 ./build/NILFS2.so build/populated.img build/proof.bin
          build/test_nilfs2 ./build/freestanding/NILFS2.so build/populated.img build/proof.bin
          sha256sum -c build/populated-before
      - name: Sanitizer qualification
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check
