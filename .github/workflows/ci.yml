# SPDX-License-Identifier: GPL-3.0-or-later
name: NILFS2 Common V2 recognition qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 4ee7591678a44af92d94eec84a8e94ccd6349e37
          path: Libraries
          persist-credentials: false
      - name: Native Common V2 hosted and import-free checks
        run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
      - name: Independent formatter image (test oracle only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nilfs-tools
          truncate -s 268435456 build/foreign.img
          mkfs.nilfs2 -f build/foreign.img
          sha256sum build/foreign.img > build/before
          build/test_nilfs2 ./build/NILFS2.so build/foreign.img
          build/test_nilfs2 ./build/freestanding/NILFS2.so build/foreign.img
          sha256sum -c build/before
      - name: Independently populated NILFS2 media (test oracle only)
        run: |
          set -euo pipefail
          # The reference implementation creates the disposable image only.
          # Native providers must read it after unmount, never through VFS.
          if ! sudo modprobe nilfs2; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe nilfs2
          fi
          truncate -s 536870912 build/populated.img
          mkfs.nilfs2 -f build/populated.img
          mkdir -p build/mnt
          dd if=/dev/urandom of=build/proof.bin bs=33001 count=1 status=none
          loop=$(sudo losetup --find --show build/populated.img)
          cleanup() {
            if mountpoint -q build/mnt; then sudo umount build/mnt; fi
            sudo losetup -d "$loop"
          }
          trap cleanup EXIT
          sudo mount -t nilfs2 -o rw,nogc "$loop" build/mnt
          sudo cp build/proof.bin build/mnt/proof.bin
          sudo mkdir build/mnt/sub
          printf hello | sudo tee build/mnt/sub/note.txt >/dev/null
          printf 'tail!' | sudo dd of=build/mnt/sparse.bin bs=1 seek=8192 status=none
          sync
          sudo cmp build/proof.bin build/mnt/proof.bin
          sudo umount build/mnt
          sudo losetup -d "$loop"
          trap - EXIT
          # Native superblock copies can point to different checkpoints.
          od -Ax -tx8 -j 1024 -N 280 build/populated.img
          od -Ax -tx8 -j 536866816 -N 280 build/populated.img
          sha256sum build/populated.img > build/populated-before
          build/test_nilfs2 ./build/NILFS2.so build/populated.img build/proof.bin
          build/test_nilfs2 ./build/freestanding/NILFS2.so build/populated.img build/proof.bin
          sha256sum -c build/populated-before
      - name: Sanitizer qualification
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  publish:
    needs: recognition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 4ee7591678a44af92d94eec84a8e94ccd6349e37
          path: Libraries
          persist-credentials: false
      - name: Build, test and publish the exact native provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Published version is immutable; increment VERSION for another release."
            exit 0
          fi
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          sh scripts/build-release.sh portable dist
          common=$(git -C Libraries rev-parse HEAD)
          curl -fsSL --retry 3 "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" -o "$work/source.tar.gz"
          curl -fsSL --retry 3 "https://codeload.github.com/Infiltrator-Projects/Libraries/tar.gz/$common" -o "$work/common.tar.gz"
          source_hash=$(sha256sum "$work/source.tar.gz" | cut -d' ' -f1)
          common_hash=$(sha256sum "$work/common.tar.gz" | cut -d' ' -f1)
          run="dist/filesystem-nilfs2-$version-native-installer.run"
          sed -e "s/@SOURCE@/$GITHUB_SHA/g" -e "s/@COMMON@/$common/g" -e "s/@SOURCE_HASH@/$source_hash/g" -e "s/@COMMON_HASH@/$common_hash/g" -e "s/@VERSION@/$version/g" scripts/installer.in > "$run"
          chmod +x "$run"
          "$run" --profile aggressive --system-package-mode --build-only --output "$work/native"
          deb="infiltrator-filesystem-nilfs2_${version}_amd64.deb"
          pdf="System/Resources/Documentation/Filesystem-NILFS2.pdf"
          so="System/Filesystems/NILFS2.so"
          for package in "dist/$deb" "$work/native/$deb"; do
            test "$(dpkg-deb -f "$package" Package)" = 'infiltrator-filesystem-nilfs2'
            test "$(dpkg-deb -f "$package" Version)" = "$version"
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            expected=$(printf './%s\n' "$pdf" "$so" | sort)
            actual=$(dpkg-deb --fsys-tarfile "$package" | tar -tf - | grep -v '/$' | sort)
            test "$actual" = "$expected"
            dpkg-deb -x "$package" "$work/extract"
            cmp "docs/NILFS2.pdf" "$work/extract/$pdf"
            test "$(nm -D --defined-only "$work/extract/$so" | awk '{print $3}')" = infiltrator_filesystem_api_v2
          done
          test ! -e "/$pdf"
          test ! -e "/$so"
          sudo dpkg -i "$work/native/$deb"
          cmp "docs/NILFS2.pdf" "/$pdf"
          cmp "$work/extract/$so" "/$so"
          sudo dpkg --purge infiltrator-filesystem-nilfs2
          test ! -e "/$pdf"
          test ! -e "/$so"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          gh release create "v$version" --target "$GITHUB_SHA" --title "NILFS2 v$version" --notes "Bounded native NILFS2 read-only Common V2 reader for the clean baseline 4 KiB checkpoint profile. Latest committed superblock, DAT/ifile allocation and namespace, sparse and B-tree reads; independently populated payload and sanitizer checks. No snapshot selection, replay, cleaning, mutation, defragmentation or physical BOOT qualification." "dist/$deb" "$run"
