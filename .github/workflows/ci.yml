# SPDX-License-Identifier: GPL-3.0-or-later
name: NILFS2 Common V2 recognition qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - name: Native Common V2 hosted and import-free checks
        run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
      - name: Independent formatter image (test oracle only)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nilfs-tools
          truncate -s 268435456 build/foreign.img
          mkfs.nilfs2 -f build/foreign.img
          sha256sum build/foreign.img > build/before
          build/test_nilfs2 ./build/NILFS2.so build/foreign.img
          build/test_nilfs2 ./build/freestanding/NILFS2.so build/foreign.img
          sha256sum -c build/before
      - name: Sanitizer qualification
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check
